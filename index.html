<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Számlák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<style>
/* 2026-11-13 (user): számla-kártyák cégenként, kattintásra naptár; kifizethetőség jelzése; költés és kifizetés összesítve.
   Szín-szerep (a korábbi oldalról, validált paletta): eval = indigó, funded = zöldeskék, kifizetés = arany, padló / bukás = piros. */
:root{
  --bg:#E9EEF0; --surface:#F7F9FA; --surface-2:#EEF2F4; --ink:#12202B; --muted:#55687A; --line:#D3DCE2; --line-2:#B9C6CF;
  --eval:#3F55C6; --funded:#0B8467; --gold:#8A6510; --gold-fill:#BE8F1F; --floor:#B4382A;
  --pos:#0A7258; --neg:#A5322A;
  --eval-bg:#E2E6F7; --funded-bg:#DAEFE8; --gold-bg:#F4EBD3; --floor-bg:#F5E0DC;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620; --surface:#16212C; --surface-2:#1C2935; --ink:#E3EAEF; --muted:#93A4B1; --line:#273746; --line-2:#3A5064;
    --eval:#8C9AF0; --funded:#3DB992; --gold:#D9AE55; --gold-fill:#B98C2E; --floor:#E0685E;
    --pos:#4FC7A0; --neg:#F08378;
    --eval-bg:#1E2747; --funded-bg:#12302A; --gold-bg:#33291A; --floor-bg:#3A1F1E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212C; --surface-2:#1C2935; --ink:#E3EAEF; --muted:#93A4B1; --line:#273746; --line-2:#3A5064;
  --eval:#8C9AF0; --funded:#3DB992; --gold:#D9AE55; --gold-fill:#B98C2E; --floor:#E0685E;
  --pos:#4FC7A0; --neg:#F08378;
  --eval-bg:#1E2747; --funded-bg:#12302A; --gold-bg:#33291A; --floor-bg:#3A1F1E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px 72px;display:flex;flex-direction:column;gap:26px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--eval);outline-offset:2px;border-radius:8px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
h1,h2,h3{font-stretch:116%;letter-spacing:-.012em;margin:0}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{font-size:30px;line-height:1.1;font-weight:760}
.top .lede{margin:6px 0 0;color:var(--muted);max-width:62ch}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .upd{color:var(--muted);font-size:13px;margin-right:6px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line-2)}
.err{background:var(--floor-bg);color:var(--neg);border-radius:12px;padding:12px 14px}

/* összesítő */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sum>div{padding:16px 20px;border-left:1px solid var(--line);min-width:0}
.sum>div:first-child{border-left:0}
.sum .k{font-size:13px;color:var(--muted)}
.sum .v{font-size:28px;line-height:1.15;font-weight:720;font-stretch:112%}
.sum .s{font-size:13px;color:var(--muted)}

/* kifizethető sáv */
.paybar{background:var(--gold-bg);border:1px solid var(--gold-fill);border-radius:14px;padding:14px 18px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.paybar b{font-weight:720}
.paybar .coin{width:14px;height:14px;border-radius:50%;background:var(--gold-fill);flex:none}
.paybar button{margin-left:auto;background:transparent;border:1px solid var(--gold-fill);border-radius:999px;padding:5px 12px;font-size:14px}

/* kártyák */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:20px;font-weight:720}
.sec-h small{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{--ph:var(--eval);--ph-bg:var(--eval-bg);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.card.funded,.card.live{--ph:var(--funded);--ph-bg:var(--funded-bg)}
.card:hover{border-color:var(--line-2)}
.card[aria-pressed="true"]{border-color:var(--ph);box-shadow:0 0 0 1px var(--ph)}
.card.off{opacity:.78}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .firm{font-weight:720;font-stretch:112%;font-size:17px;line-height:1.2}
.card .plan{color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:640;background:var(--ph-bg);color:var(--ph);white-space:nowrap}
.chip.bust{background:var(--floor-bg);color:var(--floor)} .chip.done{background:var(--surface-2);color:var(--muted)}
.card .bal{font-size:32px;line-height:1.05;font-weight:720;font-stretch:114%}
.card .sub{font-size:13.5px;color:var(--muted)}
.meter{position:relative;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:14px 0 2px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ph)}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--line-2)}
.meter .tick.goal{background:var(--ph)}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mlab .fl{color:var(--floor)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px}
.kv>span{display:flex;flex-direction:column;min-width:0} .kv .k{font-size:12px;color:var(--muted)} .kv .v{font-weight:640}
.card .ft{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.payflag{display:flex;align-items:center;gap:8px;background:var(--gold-bg);color:var(--gold);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:640}
.payflag i{width:10px;height:10px;border-radius:50%;background:var(--gold-fill);flex:none}
.payflag.wait{background:var(--surface-2);color:var(--muted);font-weight:500} .payflag.wait i{background:var(--line-2)}

/* részletek */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.panel h3{margin:0 0 14px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel h3 small{font-size:13px;font-weight:400;font-stretch:100%;color:var(--muted)}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:26px;font-weight:760}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.kpis div{padding:2px 14px;border-left:1px solid var(--line);min-width:0} .kpis div:first-child{padding-left:0;border-left:0}
.kpis b{display:block;font-size:21px;font-weight:720;font-stretch:112%} .kpis span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.calnav{display:flex;align-items:center;gap:8px}
.calnav button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;width:32px;height:32px}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.9fr);gap:6px}
.cal .h{font-size:12px;color:var(--muted);text-align:left;padding:0 4px}
.cal .d{min-height:74px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-width:0;background:var(--surface)}
.cal .d.out{opacity:.35}
.cal .d.has{cursor:pointer}
.cal .d.w{background:var(--funded-bg);border-color:transparent} .cal .d.l{background:var(--floor-bg);border-color:transparent}
.cal .d.sel{box-shadow:0 0 0 2px var(--ink)}
.cal .d.today .dn{font-weight:800;color:var(--ink)}
.cal .d.wk{background:var(--surface-2);border-style:dashed}
.cal .dn{font-size:12px;color:var(--muted)}
.cal .pl{font-weight:680;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cal .nt{font-size:11.5px;color:var(--muted)}
.cal .evb{align-self:flex-start;font-size:11px;font-weight:640;border-radius:999px;padding:0 7px;background:var(--gold-bg);color:var(--gold)}
.msum{margin:12px 0 0;font-size:14px;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;align-items:start}
.check .m{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.check .ok .m{background:var(--funded-bg);color:var(--funded);border-color:transparent}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger td{padding:6px 0;border-top:1px solid var(--line)} .ledger tr:first-child td{border-top:0}
.ledger td:last-child{text-align:right;font-weight:640;white-space:nowrap}
.ledger .tot td{border-top:2px solid var(--line-2);font-weight:720}
.tblwrap{overflow-x:auto}
table.tr{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.tr th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
table.tr td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.tr td.r,table.tr th.r{text-align:right;padding-right:0}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.note{font-size:13px;color:var(--muted);max-width:90ch}

@media (max-width:900px){ .grid{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 0} .kpis div:nth-child(4){padding-left:0;border-left:0} }
@media (max-width:640px){
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))} .sum>div:nth-child(3){border-left:0} .sum>div:nth-child(n+3){border-top:1px solid var(--line)}
  .sum .v{font-size:23px} .top h1{font-size:26px} .cal{gap:4px} .cal .d{min-height:62px;padding:5px 5px} .cal .pl{font-size:12px} .cal .nt{display:none}
  .panel{padding:16px 14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Számlák</h1>
      <p class="lede">A megvett prop-fiókok állapota, napi eredménye, a kifizetések és az eddigi költés.</p>
    </div>
    <div class="tools"><span class="upd" id="upd"></span><a class="btn" href="botok">Papír-botok</a><button class="btn" id="theme" type="button" aria-label="Világos / sötét téma">Téma</button></div>
  </header>
  <div id="err"></div>
  <section class="sum" id="sum" aria-label="Összesítés"></section>
  <div id="paybar"></div>
  <section>
    <div class="sec-h"><h2>Aktív számlák</h2><small id="actNote"></small></div>
    <div class="cards" id="cards" style="margin-top:12px"></div>
  </section>
  <section id="detail" hidden></section>
  <section id="closedSec" hidden>
    <div class="sec-h"><h2>Lezárt számlák</h2><small>Bukott, passzolt vagy megszűnt fiókok. A költésük és a kifizetéseik az összesítésben benne vannak.</small></div>
    <div class="cards" id="closed" style="margin-top:12px"></div>
  </section>
  <p class="note" id="foot"></p>
</div>
<script>
const DATA_URL='https://rfmmwzrgxxcaknufcfui.supabase.co/storage/v1/object/public/paper/accounts.json';
const S={data:null,sel:null,month:null,day:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grp=(x,d)=>{const [a,b]=Math.abs(x).toFixed(d).split('.'); return a.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+(b?','+b:'');};
const nf0={format:x=>grp(x,0)}, nf2={format:x=>grp(x,2)};
const usd=(v,d)=>v==null||isNaN(v)?'–':(v<0?'−':'')+'$'+(d?nf2:nf0).format(Math.abs(v));
const sgn=(v,d)=>v==null||isNaN(v)?'–':(v>0?'+':v<0?'−':'')+'$'+(d?nf2:nf0).format(Math.abs(v));
const cls=v=>v>0?'pos':v<0?'neg':'';
const PH={eval:'Eval',funded:'Funded',live:'Élő'};
const short=id=>{const s=String(id); return s.length>10?'…'+s.slice(-6):s;};
const todayNY=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date()); const g=k=>p.find(x=>x.type===k).value; let d=new Date(`${g('year')}-${g('month')}-${g('day')}T12:00:00`); if(+g('hour')>=18) d.setDate(d.getDate()+1); return d.toISOString().slice(0,10);};
const dLabel=iso=>new Date(iso+'T12:00:00').toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
function accts(){return S.data?S.data.szamlak:[];}
function sel(){return accts().find(a=>a.id===S.sel);}

function chip(a){
  if(a.allapot==='bukott') return '<span class="chip bust">Bukott</span>';
  if(a.allapot==='passzolt') return '<span class="chip done">Passzolt</span>';
  if(a.allapot!=='aktív') return `<span class="chip done">${esc(a.allapot)}</span>`;
  return `<span class="chip">${PH[a.fazis]||esc(a.fazis)}</span>`;
}
function meter(a){
  if(a.padlo==null) return '';
  const lo=a.padlo, goal=a.fazis==='eval'&&a.cel?a.kezdo+a.cel:null, hi=goal!=null?goal:Math.max(a.egyenleg,a.kezdo+(a.mll||1000))*1+0, span=Math.max(hi-lo,1);
  const pc=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
  return `<div><div class="meter" role="img" aria-label="Egyenleg a padló és a ${goal!=null?'cél':'felső sáv'} között: ${usd(a.egyenleg)}"><span class="fill" style="width:${pc(a.egyenleg)}%"></span><span class="tick" style="left:${pc(a.kezdo)}%" title="Kezdő egyenleg"></span></div>
    <div class="mlab"><span class="fl">padló ${usd(lo)}</span><span>${goal!=null?'cél '+usd(goal):'kezdő '+usd(a.kezdo)}</span></div></div>`;
}
function payFlag(a){
  const k=a.kifizetheto; if(!k) return '';
  if(k.lehet) return `<div class="payflag"><i></i>Kifizetés kérhető: ${usd(k.osszeg)} (neked ${usd(k.kapnal)})</div>`;
  const ok=k.feltetelek.filter(f=>f.ok).length; return `<div class="payflag wait"><i></i>Kifizetéshez ${ok} / ${k.feltetelek.length} feltétel megvan</div>`;
}
function card(a){
  const on=S.sel===a.id, act=a.allapot==='aktív';
  const kv=a.fazis==='eval'&&act
    ? [['Célig',usd(a.cel_hatra)],['Párna',usd(a.parna)],['Ma',`<span class="${cls(a.ma)}">${sgn(a.ma)}</span>`]]
    : [['Párna',act?usd(a.parna):'–'],['Kifizetve',usd(a.kapott)],['Ma',act?`<span class="${cls(a.ma)}">${sgn(a.ma)}</span>`:'–']];
  return `<button type="button" class="card ${esc(a.fazis)} ${act?'':'off'}" aria-pressed="${on}" data-id="${esc(a.id)}">
    <div class="hd"><div><div class="firm">${esc(a.ceg)}</div><div class="plan">${esc(a.csomag)} · ${esc(short(a.id))}</div></div>${chip(a)}</div>
    <div><div class="bal">${usd(a.egyenleg)}</div><div class="sub">Eredmény <b class="${cls(a.pnl)}">${sgn(a.pnl)}</b>${a.nyitott?` · ${a.nyitott} nyitott pozíció`:''}</div></div>
    ${act?meter(a):''}
    <div class="kv">${kv.map(([k,v])=>`<span><span class="k">${k}</span><span class="v">${v}</span></span>`).join('')}</div>
    ${payFlag(a)}
    <div class="ft"><span>Ára ${a.ar_ismert?usd(a.koltes):'nincs megadva'}</span><span>${a.kifizetesek.length?a.kifizetesek.length+' kifizetés · '+usd(a.kapott):'még nincs kifizetés'}</span></div>
  </button>`;
}
function renderSum(){
  const o=S.data.osszesen, A=accts();
  $('sum').innerHTML=[
    ['Elköltve',usd(o.koltes),`${A.length} fiók`+(o.ar_hianyzik.length?` · ${o.ar_hianyzik.length} ára hiányzik`:'')],
    ['Kifizetve (neked)',usd(o.kapott),o.kifizetes_db?`${o.kifizetes_db} kifizetés`:'még nincs kifizetés'],
    ['Mérleg',`<span class="${cls(o.netto)}">${sgn(o.netto)}</span>`,'kifizetés − költés'],
    ['Aktív számlák',o.aktiv,`${o.aktiv-o.funded} eval · ${o.funded} funded`+(o.bukott?` · ${o.bukott} bukott`:'')]
  ].map(([k,v,s])=>`<div><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  const P=A.filter(a=>a.kifizetheto&&a.kifizetheto.lehet);
  $('paybar').innerHTML=P.length?`<div class="paybar" role="status"><span class="coin"></span><span><b>Kifizetés kérhető</b> ${P.map(a=>`${esc(a.ceg)} ${esc(short(a.id))}: ${usd(a.kifizetheto.osszeg)}`).join(' · ')} — összesen neked <b>${usd(o.kifizetheto)}</b></span><button type="button" data-id="${esc(P[0].id)}">Megnézem</button></div>`:'';
  const pb=$('paybar').querySelector('button'); if(pb) pb.onclick=()=>pick(pb.dataset.id,true);
}
function renderCards(){
  const A=accts(), act=A.filter(a=>a.allapot==='aktív'), cl=A.filter(a=>a.allapot!=='aktív');
  $('cards').innerHTML=act.length?act.map(card).join(''):'<div class="empty">Nincs aktív számla.</div>';
  $('actNote').textContent=act.length?'Kattints egy kártyára a naptárért és a részletekért.':'';
  $('closedSec').hidden=!cl.length; $('closed').innerHTML=cl.map(card).join('');
  document.querySelectorAll('.card').forEach(el=>el.onclick=()=>pick(el.dataset.id));
}
function pick(id,scroll){ S.sel=S.sel===id&&!scroll?null:id; S.month=null; S.day=null; try{history.replaceState(null,'',S.sel?'#'+encodeURIComponent(S.sel):location.pathname);}catch(e){} render(); if(S.sel&&scroll!==false) $('detail').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); }

function calHtml(a){
  const days=a.napok||{}, keys=Object.keys(days).sort(); if(!S.month) S.month=(keys.length?keys[keys.length-1]:todayNY()).slice(0,7);
  const [y,m]=S.month.split('-').map(Number), first=new Date(y,m-1,1), last=new Date(y,m,0), today=todayNY();
  const pay={}; for(const k of a.kifizetesek||[]) (pay[k.nap]=pay[k.nap]||[]).push(k);
  let start=new Date(first); start.setDate(start.getDate()-((start.getDay()+6)%7));
  let h=['H','K','Sze','Cs','P','Hét'].map(x=>`<div class="h">${x}</div>`).join(''), mT=0,mW=0,mL=0,mP=0;
  for(let d=new Date(start);;){
    let wk=0,wn=0;
    for(let i=0;i<7;i++){
      const iso=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10), inM=d.getMonth()===m-1, v=days[iso];
      if(v){wk+=v.pnl;wn+=v.n; if(inM){mT+=v.pnl; if(v.pnl>0)mW++; else if(v.pnl<0)mL++;}}
      if(inM) for(const k of pay[iso]||[]) mP+=k.kapott!=null?k.kapott:k.osszeg;
      if(i<5) h+=`<div class="d ${v?(v.pnl>0?'w':v.pnl<0?'l':''):''} ${v?'has':''} ${inM?'':'out'} ${S.day===iso?'sel':''} ${iso===today?'today':''}" ${v?`data-d="${iso}" role="button" tabindex="0" aria-label="${dLabel(iso)}: ${sgn(v.pnl,1)}"`:''}><span class="dn">${d.getDate()}</span>${(pay[iso]||[]).map(k=>`<span class="evb">kifizetés ${usd(k.osszeg)}</span>`).join('')}${v?`<span><div class="pl ${cls(v.pnl)}">${sgn(v.pnl)}</div><div class="nt">${v.n} kötés</div></span>`:''}</div>`;
      d.setDate(d.getDate()+1);
    }
    h+=`<div class="d wk"><span class="dn">hét</span>${wn?`<span><div class="pl ${cls(wk)}">${sgn(wk)}</div><div class="nt">${wn} kötés</div></span>`:''}</div>`;
    if(d>last) break;
  }
  return {html:h,label:first.toLocaleDateString('hu-HU',{year:'numeric',month:'long'}),sum:`A hónap: <b class="${cls(mT)}">${sgn(mT)}</b>, ${mW} nyerő és ${mL} vesztes nap${mP?`; kifizetve <b>${usd(mP)}</b>`:''}.`};
}
function renderDetail(){
  const a=sel(), el=$('detail'); if(!a){el.hidden=true;el.innerHTML='';return;} el.hidden=false;
  const dv=Object.values(a.napok||{}), win=dv.filter(v=>v.pnl>0).length, best=dv.length?Math.max(...dv.map(v=>v.pnl)):null, worst=dv.length?Math.min(...dv.map(v=>v.pnl)):null, C=calHtml(a), k=a.kifizetheto;
  const kp=[['Egyenleg',usd(a.egyenleg,1),''],['Eredmény',sgn(a.pnl,1),cls(a.pnl)],[a.fazis==='eval'?'Célig':'Kifizetve',a.fazis==='eval'?usd(a.cel_hatra):usd(a.kapott),''],['Párna a padlóig',usd(a.parna),''],['Nyerő napok',dv.length?`${win} / ${dv.length}`:'–',''],['Legjobb / legrosszabb nap',dv.length?`${sgn(best)} / ${sgn(worst)}`:'–','']];
  const T=(a.tradek||[]).filter(t=>!S.day||t.nap===S.day).slice().reverse().slice(0,200);
  const tf=new Intl.DateTimeFormat('hu-HU',{timeZone:'America/New_York',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const led=[[`Vásárlás${a.vasarolva?' · '+a.vasarolva:''}`,a.ar_ismert?-a.ar:null],...(a.koltsegek||[]).map(c=>[`${esc(c.megj||'Költség')}${c.nap?' · '+c.nap:''}`,-c.osszeg]),...(a.kifizetesek||[]).map((p,i)=>[`${i+1}. kifizetés · ${p.nap}${p.becsult?' (becsült)':''}${p.kapott!=null&&p.kapott!==p.osszeg?` · kivéve ${usd(p.osszeg)}`:''}`,p.kapott!=null?p.kapott:p.osszeg])];
  const net=a.kapott-a.koltes;
  el.innerHTML=`
  <div class="panel" style="display:flex;flex-direction:column;gap:18px">
    <div class="dhead"><div><h2>${esc(a.ceg)} · ${esc(a.csomag)}</h2><div class="muted">${esc(a.id)} · ${chip(a)}${a.vasarolva?' · vásárolva '+a.vasarolva:''}</div></div><button class="btn" type="button" id="closeD">Bezárás</button></div>
    <div class="kpis">${kp.map(([l,v,c])=>`<div><span>${l}</span><b class="${c}">${v}</b></div>`).join('')}</div>
  </div>
  <div class="grid" style="margin-top:20px">
    <div class="panel">
      <h3><span>Napi eredmény</span><span class="calnav"><button type="button" id="mPrev" aria-label="Előző hónap">‹</button><small style="min-width:120px;text-align:center">${C.label}</small><button type="button" id="mNext" aria-label="Következő hónap">›</button></span></h3>
      <div class="cal" id="cal">${C.html}</div>
      <p class="msum">${C.sum}</p>
    </div>
    <div class="side">
      ${k?`<div class="panel"><h3><span>Kifizetés</span><small>${k.hanyadik?k.hanyadik+'. kifizetés':''}</small></h3>
        ${k.lehet?`<div class="payflag" style="margin-bottom:12px"><i></i>Most kérhető: ${usd(k.osszeg)}, ebből neked ${usd(k.kapnal)}</div>`:''}
        <ul class="check">${k.feltetelek.map(f=>`<li class="${f.ok?'ok':''}"><span class="m">${f.ok?'✓':'·'}</span><span>${esc(f.szoveg)}</span></li>`).join('')}</ul></div>`
      :(a.fazis==='eval'&&a.allapot==='aktív'?`<div class="panel"><h3>Kifizetés</h3><div class="empty">Eval fázisban nincs kifizetés. A célig még ${usd(a.cel_hatra)} hiányzik.</div></div>`:'')}
      <div class="panel"><h3>Pénzügyek</h3><table class="ledger"><tbody>${led.map(([l,v])=>`<tr><td>${l}</td><td class="${v==null?'muted':cls(v)}">${v==null?'nincs megadva':sgn(v,1)}</td></tr>`).join('')}<tr class="tot"><td>Mérleg ezen a fiókon</td><td class="${cls(net)}">${sgn(net,1)}</td></tr></tbody></table></div>
      <div class="panel"><h3>Szabályok</h3><table class="ledger"><tbody>
        ${a.cel?`<tr><td>Profit-cél</td><td>${usd(a.cel)}</td></tr>`:''}${a.mll?`<tr><td>Max veszteség (padló ${usd(a.padlo)})</td><td>${usd(a.mll)}</td></tr>`:''}${a.napi_limit?`<tr><td>Napi limit</td><td>${usd(a.napi_limit)}</td></tr>`:''}${a.max_mini?`<tr><td>Max méret</td><td>${a.max_mini} mini / ${a.max_mini*10} mikro</td></tr>`:''}${a.szabaly&&a.szabaly.ejszaka===false?`<tr><td>Éjszakán át tartás</td><td>nem</td></tr>`:''}
      </tbody></table></div>
    </div>
  </div>
  <div class="panel" style="margin-top:20px">
    <h3><span>Kötések${S.day?' · '+dLabel(S.day):''}</span><small>${S.day?'<a href="#" id="clrDay">minden nap</a>':`${a.trade_db} kötés összesen · a legutóbbiak`}</small></h3>
    ${T.length?`<div class="tblwrap"><table class="tr"><thead><tr><th>Idő (New York)</th><th>Kontraktus</th><th>Oldal</th><th class="r">Db</th><th class="r">Ár</th><th class="r">Eredmény (díjjal)</th></tr></thead><tbody>${T.map(t=>`<tr><td>${t.t?tf.format(new Date(t.t.replace(/(\.\d{3})\d+/,'$1'))):esc(t.nap)}</td><td>${esc(t.k||'–')}</td><td>${t.o==='buy'?'vétel':t.o==='sell'?'eladás':'–'}</td><td class="r">${t.db==null?'–':t.db}</td><td class="r">${t.ar==null?'–':nf2.format(t.ar)}</td><td class="r ${cls(t.pnl)}">${sgn(t.pnl,1)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Még nincs kötés.</div>'}
  </div>`;
  $('closeD').onclick=()=>pick(a.id);
  const step=n=>{const [y,m]=S.month.split('-').map(Number); const d=new Date(y,m-1+n,1); S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); S.day=null; renderDetail();};
  $('mPrev').onclick=()=>step(-1); $('mNext').onclick=()=>step(1);
  $('cal').querySelectorAll('.d.has').forEach(e=>{const f=()=>{S.day=S.day===e.dataset.d?null:e.dataset.d;renderDetail();}; e.onclick=f; e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();f();}};});
  const c=$('clrDay'); if(c) c.onclick=ev=>{ev.preventDefault();S.day=null;renderDetail();};
}
function render(){ if(!S.data) return; renderSum(); renderCards(); renderDetail();
  const d=new Date(S.data.frissitve); $('upd').textContent='Frissítve '+d.toLocaleString('hu-HU',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+(S.stale?' (mentett állapot)':'');
  $('err').innerHTML=(S.data.hibak||[]).length?`<div class="err">${S.data.hibak.map(esc).join('<br>')}</div>`:'';
  $('foot').textContent='Az egyenleg és a kötések a cégek rendszeréből jönnek, néhány percenként frissülve. A fiókok ára és a kifizetések a főkönyvből; a becsültként jelölt kifizetés összegét az egyenleg-változásból számolja az oldal.';
}
async function load(){
  let D=null; S.stale=false;
  try{ const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); if(r.ok) D=await r.json(); }catch(e){}
  if(!D){ try{ const r=await fetch('accounts.json',{cache:'no-cache'}); if(r.ok){ D=await r.json(); S.stale=true; } }catch(e){} }
  if(!D){ if(!S.data) $('err').innerHTML='<div class="err">Az adat most nem érhető el. Az oldal percenként újrapróbálja.</div>'; return; }
  S.data=D; if(S.sel==null&&location.hash){ const h=decodeURIComponent(location.hash.slice(1)); if(accts().some(a=>a.id===h)) S.sel=h; }
  if(S.sel&&!sel()) S.sel=null; render();
}
$('theme').onclick=()=>{const r=document.documentElement, cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark'; try{localStorage.setItem('theme',r.dataset.theme);}catch(e){}};
try{const t=localStorage.getItem('theme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}
load(); setInterval(load,60000);
</script>
</body>
