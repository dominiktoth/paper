<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Számla-flotta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap">
<style>
/* 2026-11-13 v2 (user: „ultrafuturisztikus”): flotta-vezérlő. Mélyűr-háttér csillagmezővel, a számlák egy pályarendszeren keringenek a mérleg körül,
   a kártyák letört sarkú holo-panelek gyűrűs műszerrel. Csak sötét. Szerepek: eval = ion-ibolya, funded = plazma-cián, kifizetés = arany, veszteség / padló = rózsavörös, nyereség = menta. */
:root{
  --void:#04060F; --deep:#080C1E; --panel:#0B1228; --panel-2:#101A38; --ink:#DCE8FF; --muted:#8493BD; --line:#1C2850; --line-2:#2D3E78;
  --eval:#9B7BFF; --funded:#3DF2FF; --gold:#FFC94A; --floor:#FF5C8A; --pos:#4DFFC0; --neg:#FF6B94;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--void);color:var(--ink);font:400 15px/1.55 "Exo 2",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(1100px 620px at 78% -8%,rgba(61,242,255,.13),transparent 62%),radial-gradient(900px 600px at 6% 12%,rgba(155,123,255,.16),transparent 60%),linear-gradient(180deg,#04060F,#070A1A 55%,#04060F)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 80px;display:flex;flex-direction:column;gap:26px}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--funded);outline-offset:3px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
h1,h2,h3,.dsp{font-family:"Chakra Petch","Exo 2",sans-serif;margin:0;letter-spacing:.01em}

/* fejléc */
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark{width:38px;height:38px;flex:none}
.top h1{font-size:26px;font-weight:700;line-height:1}
.top .lede{margin:3px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools .upd{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:8px}
.tools .upd i{width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 10px var(--pos)}
.tools .upd.stale i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.btn{background:rgba(16,26,56,.7);border:1px solid var(--line-2);padding:7px 16px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);font-family:"Chakra Petch",sans-serif;font-weight:500}
.btn:hover{border-color:var(--funded);color:var(--funded)}
.err{background:rgba(255,92,138,.12);border:1px solid var(--floor);color:var(--neg);padding:12px 14px}

/* hős: pályarendszer */
.hero{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(11,18,40,.55),rgba(4,6,15,.2));overflow:hidden;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;opacity:.5;
  background:linear-gradient(transparent,rgba(4,6,15,.0)),repeating-linear-gradient(90deg,rgba(61,242,255,.16) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(61,242,255,.16) 0 1px,transparent 1px 32px);
  transform:perspective(520px) rotateX(62deg) scale(1.9);transform-origin:50% 100%;mask-image:linear-gradient(transparent,#000 70%);-webkit-mask-image:linear-gradient(transparent,#000 70%)}
#orbit{display:block;width:100%;height:auto;position:relative;z-index:1}
#orbit .node{cursor:pointer}
#orbit .node:focus-visible{outline:none}
#orbit .node:focus-visible .halo{stroke:#fff;stroke-width:2}
#orbit text{font-family:"Chakra Petch",sans-serif;fill:var(--ink);paint-order:stroke;stroke:#060918;stroke-width:5px;stroke-linejoin:round}
.hud{position:absolute;z-index:2;display:flex;flex-direction:column;gap:1px;min-width:150px}
.hud .k{font-size:12.5px;color:var(--muted)}
.hud .v{font-family:"Chakra Petch",sans-serif;font-size:27px;font-weight:600;line-height:1.1}
.hud .s{font-size:12.5px;color:var(--muted)}
.hud::before{content:"";width:34px;height:2px;background:var(--c,var(--funded));box-shadow:0 0 12px var(--c,var(--funded));margin-bottom:8px}
.hud.tl{left:26px;top:22px} .hud.tr{right:26px;top:22px;text-align:right;align-items:flex-end} .hud.bl{left:26px;bottom:20px} .hud.br{right:26px;bottom:20px;text-align:right;align-items:flex-end}

/* kifizethető sáv */
.paybar{position:relative;border:1px solid var(--gold);background:linear-gradient(90deg,rgba(255,201,74,.16),rgba(255,201,74,.04));padding:13px 18px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.paybar b{font-family:"Chakra Petch",sans-serif;font-weight:600;color:var(--gold)}
.paybar .coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);flex:none;animation:pulse 1.8s ease-in-out infinite}
.paybar button{margin-left:auto;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:5px 14px;font-size:14px;font-family:"Chakra Petch",sans-serif}
@keyframes pulse{50%{opacity:.35}}

/* kártyák */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:"";width:10px;height:10px;background:var(--funded);box-shadow:0 0 12px var(--funded);transform:rotate(45deg)}
.sec-h small{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cw{--ph:var(--eval);min-width:0;filter:drop-shadow(0 0 0 transparent);transition:filter .2s}
.cw.funded,.cw.live{--ph:var(--funded)} .cw.bust{--ph:var(--floor)} .cw.done{--ph:var(--line-2)} .cw.pay{--ph2:var(--gold)}
.cw:hover{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ph) 45%,transparent))}
.cw.on{filter:drop-shadow(0 0 20px color-mix(in srgb,var(--ph) 70%,transparent))}
.cw.pay{filter:drop-shadow(0 0 16px rgba(255,201,74,.55))}
.card{--cut:18px;position:relative;width:100%;text-align:left;border:0;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(135deg,var(--ph),color-mix(in srgb,var(--ph) 18%,var(--line)) 38%,var(--line) 62%,color-mix(in srgb,var(--ph2,var(--ph)) 70%,var(--line)));
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.card::before{content:"";position:absolute;inset:1px;background:linear-gradient(160deg,rgba(16,26,56,.97),rgba(8,12,30,.98));clip-path:polygon(calc(var(--cut) - .5px) 0,100% 0,100% calc(100% - var(--cut) + .5px),calc(100% - var(--cut) + .5px) 100%,0 100%,0 calc(var(--cut) - .5px))}
.card::after{content:"";position:absolute;inset:1px;pointer-events:none;opacity:.35;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
.card>*{position:relative;z-index:1}
.cw.off .card{opacity:.8}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .firm{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:18px;line-height:1.2}
.card .plan{color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:2px 10px 2px 8px;font-size:12.5px;font-weight:600;font-family:"Chakra Petch",sans-serif;color:var(--ph);border:1px solid color-mix(in srgb,var(--ph) 55%,transparent);background:color-mix(in srgb,var(--ph) 12%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ph);box-shadow:0 0 8px var(--ph)}
.chip.bust{--ph:var(--floor)} .chip.done{--ph:var(--muted)}
.core{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center}
.gauge{width:132px;height:132px}
.gauge text{font-family:"Chakra Petch",sans-serif}
.card .bal{font-family:"Chakra Petch",sans-serif;font-size:31px;line-height:1.05;font-weight:600;white-space:nowrap}
.card .sub{font-size:13.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px;border-top:1px solid var(--line);padding-top:10px}
.kv>span{display:flex;flex-direction:column;min-width:0} .kv .k{font-size:12px;color:var(--muted)} .kv .v{font-weight:600;font-family:"Chakra Petch",sans-serif}
.card .ft{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.payflag{display:flex;align-items:center;gap:9px;border:1px solid var(--gold);background:rgba(255,201,74,.1);color:var(--gold);padding:6px 10px;font-size:13.5px;font-weight:600}
.payflag i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);flex:none;animation:pulse 1.8s ease-in-out infinite}
.payflag.wait{border-color:var(--line-2);background:rgba(45,62,120,.18);color:var(--muted);font-weight:500} .payflag.wait i{background:var(--line-2);box-shadow:none;animation:none}

/* részletek */
.panel{position:relative;background:linear-gradient(160deg,rgba(16,26,56,.82),rgba(8,12,30,.86));border:1px solid var(--line);padding:20px 22px;min-width:0;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.panel::before{content:"";position:absolute;left:0;top:0;width:54px;height:2px;background:var(--ph,var(--funded));box-shadow:0 0 12px var(--ph,var(--funded))}
.panel h3{margin:0 0 14px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel h3 small{font-size:13px;font-weight:400;font-family:"Exo 2",sans-serif;color:var(--muted)}
#detail{--ph:var(--eval)} #detail.funded,#detail.live{--ph:var(--funded)}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:27px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.kpis div{padding:2px 14px;border-left:1px solid var(--line);min-width:0} .kpis div:first-child{padding-left:0;border-left:0}
.kpis b{display:block;font-family:"Chakra Petch",sans-serif;font-size:21px;font-weight:600} .kpis span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.calnav{display:flex;align-items:center;gap:8px}
.calnav button{background:transparent;border:1px solid var(--line-2);width:32px;height:32px;color:var(--funded)}
.calnav button:hover{border-color:var(--funded)}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.9fr);gap:6px}
.cal .h{font-size:12px;color:var(--muted);padding:0 4px}
.cal .d{--a:0;min-height:76px;border:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-width:0;background:rgba(8,12,30,.6);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cal .d.out{opacity:.3}
.cal .d.has{cursor:pointer}
.cal .d.w{border-color:color-mix(in srgb,var(--pos) calc(35% + var(--a)*65%),var(--line));background:color-mix(in srgb,var(--pos) calc(7% + var(--a)*26%),rgba(8,12,30,.7))}
.cal .d.l{border-color:color-mix(in srgb,var(--neg) calc(35% + var(--a)*65%),var(--line));background:color-mix(in srgb,var(--neg) calc(7% + var(--a)*26%),rgba(8,12,30,.7))}
.cal .d.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.today .dn{color:var(--funded);font-weight:700}
.cal .d.wk{background:rgba(16,26,56,.5);border-style:dashed}
.cal .dn{font-size:12px;color:var(--muted)}
.cal .pl{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cal .nt{font-size:11.5px;color:var(--muted)}
.cal .evb{align-self:flex-start;font-size:11px;font-weight:600;padding:0 6px;border:1px solid var(--gold);color:var(--gold)}
.msum{margin:12px 0 0;font-size:14px;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.check li{display:grid;grid-template-columns:22px 1fr;gap:9px;font-size:14px;align-items:start}
.check .m{width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line-2);transform:rotate(45deg)} .check .m span{transform:rotate(-45deg)}
.check .ok .m{color:var(--pos);border-color:var(--pos);box-shadow:0 0 10px rgba(77,255,192,.4)}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger td{padding:7px 0;border-top:1px solid var(--line)} .ledger tr:first-child td{border-top:0}
.ledger td:last-child{text-align:right;font-weight:600;white-space:nowrap;font-family:"Chakra Petch",sans-serif}
.ledger .tot td{border-top:1px solid var(--line-2);font-weight:600}
.tblwrap{overflow-x:auto}
table.tr{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.tr th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 10px 6px 0;border-bottom:1px solid var(--line-2)}
table.tr td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.tr td.r,table.tr th.r{text-align:right;padding-right:0}
table.tr td.r{font-family:"Chakra Petch",sans-serif}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.note{font-size:13px;color:var(--muted);max-width:90ch}

@media (max-width:900px){ .grid{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 0} .kpis div:nth-child(4){padding-left:0;border-left:0} }
@media (max-width:720px){
  .hud{position:static;min-width:0} .hud.tr,.hud.br{text-align:left;align-items:flex-start}
  .huds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;padding:4px 18px 20px;position:relative;z-index:2}
  .hud .v{font-size:22px} .hero::after{display:none}
  .kpis b{font-size:17px} .kpis div{padding:2px 8px} .dhead h2{font-size:22px}
  .top h1{font-size:22px} .cal{gap:4px} .cal .d{min-height:62px;padding:5px} .cal .pl{font-size:12px} .cal .nt{display:none} .panel{padding:16px 14px}
  .cards{grid-template-columns:1fr} .core{grid-template-columns:112px minmax(0,1fr)} .gauge{width:112px;height:112px} .card .bal{font-size:26px}
}
@media (prefers-reduced-motion: reduce){ .paybar .coin,.payflag i{animation:none} }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#3DF2FF" stroke-width="1.4" transform="rotate(-24 20 20)"/><ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#9B7BFF" stroke-width="1.4" transform="rotate(38 20 20)"/><circle cx="20" cy="20" r="4.5" fill="#FFC94A"/></svg>
      <div><h1>Számla-flotta</h1><p class="lede">A prop-fiókok állapota, napi eredménye, kifizetései és az eddigi költés.</p></div>
    </div>
    <div class="tools"><span class="upd" id="upd"></span><a class="btn" href="botok">Papír-botok</a></div>
  </header>
  <div id="err"></div>
  <section class="hero" aria-label="A flotta áttekintése">
    <svg id="orbit" viewBox="0 0 1000 400" role="group" aria-label="A számlák a mérleg körül keringenek; egy számlára kattintva megnyílnak a részletei"></svg>
    <div class="huds" id="huds"></div>
  </section>
  <div id="paybar"></div>
  <section>
    <div class="sec-h"><h2>Aktív számlák</h2><small id="actNote"></small></div>
    <div class="cards" id="cards" style="margin-top:12px"></div>
  </section>
  <section id="detail" hidden></section>
  <section id="closedSec" hidden>
    <div class="sec-h"><h2>Lezárt számlák</h2><small>Bukott, passzolt vagy megszűnt fiókok. A költésük és a kifizetéseik az összesítésben benne vannak.</small></div>
    <div class="cards" id="closed" style="margin-top:12px"></div>
  </section>
  <p class="note" id="foot"></p>
</div>
<script>
const DATA_URL='https://rfmmwzrgxxcaknufcfui.supabase.co/storage/v1/object/public/paper/accounts.json';
const S={data:null,sel:null,month:null,day:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grp=(x,d)=>{const [a,b]=Math.abs(x).toFixed(d).split('.'); return a.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+(b?','+b:'');};
const nf0={format:x=>grp(x,0)}, nf2={format:x=>grp(x,2)};
const usd=(v,d)=>v==null||isNaN(v)?'–':(v<0?'−':'')+'$'+(d?nf2:nf0).format(Math.abs(v));
const sgn=(v,d)=>v==null||isNaN(v)?'–':(v>0?'+':v<0?'−':'')+'$'+(d?nf2:nf0).format(Math.abs(v));
const cls=v=>v>0?'pos':v<0?'neg':'';
const PH={eval:'Eval',funded:'Funded',live:'Élő'};
const short=id=>{const s=String(id); return s.length>10?'…'+s.slice(-6):s;};
const todayNY=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date()); const g=k=>p.find(x=>x.type===k).value; let d=new Date(`${g('year')}-${g('month')}-${g('day')}T12:00:00`); if(+g('hour')>=18) d.setDate(d.getDate()+1); return d.toISOString().slice(0,10);};
const dLabel=iso=>new Date(iso+'T12:00:00').toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
function accts(){return S.data?S.data.szamlak:[];}
function sel(){return accts().find(a=>a.id===S.sel);}

function phCls(a){ return a.allapot==='bukott'?'bust':a.allapot!=='aktív'?'done':a.fazis; }
function chip(a){
  if(a.allapot==='bukott') return '<span class="chip bust">Bukott</span>';
  if(a.allapot==='passzolt') return '<span class="chip done">Passzolt</span>';
  if(a.allapot!=='aktív') return `<span class="chip done">${esc(a.allapot)}</span>`;
  return `<span class="chip">${PH[a.fazis]||esc(a.fazis)}</span>`;
}
// gyűrűs műszer: 270°-os ív a padlótól a célig (funded: a padlótól a felső sávig); jel a kezdő egyenlegnél
function gauge(a){
  const act=a.allapot==='aktív', R=52, C=66, A0=135, SW=270, pt=(deg,r)=>{const t=deg*Math.PI/180; return [C+r*Math.cos(t),C+r*Math.sin(t)];};
  const arc=(f0,f1,r)=>{const [x0,y0]=pt(A0+SW*f0,r),[x1,y1]=pt(A0+SW*f1,r); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${SW*(f1-f0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;};
  let f=0,fs=null,big='–',small='';

  $('foot').textContent='Az egyenleg és a kötések a cégek rendszeréből jönnek, néhány percenként frissülve. A fiókok ára és a kifizetések a főkönyvből; a becsültként jelölt kifizetés összegét az egyenleg-változásból számolja az oldal.';
}
async function load(){
  let D=null; S.stale=false;
  if(!/[?&]local=1/.test(location.search)){ try{ const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); if(r.ok) D=await r.json(); }catch(e){} }
  if(!D){ try{ const r=await fetch('accounts.json',{cache:'no-cache'}); if(r.ok){ D=await r.json(); S.stale=true; } }catch(e){} }
  if(!D){ if(!S.data) $('err').innerHTML='<div class="err">Az adat most nem érhető el. Az oldal percenként újrapróbálja.</div>'; return; }
  S.data=D; if(S.sel==null&&location.hash){ const h=decodeURIComponent(location.hash.slice(1)); if(accts().some(a=>a.id===h)) S.sel=h; }
  if(S.sel&&!sel()) S.sel=null; render();
}
// csillagmező: lassan sodródó pontok két mélységben (egyetlen háttér-mozgás; csökkentett mozgásnál áll)
(function(){ const c=$('stars'), x=c.getContext('2d'); let W=0,H=0,st=[],raf=0; const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ const d=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight; c.width=W*d;c.height=H*d; x.setTransform(d,0,0,d,0,0); const n=Math.round(W*H/5200); let s=7; const r=()=>(s=(s*16807)%2147483647)/2147483647; st=Array.from({length:n},()=>({x:r()*W,y:r()*H,z:.25+r()*.75,c:r()<.12?'#3DF2FF':r()<.2?'#9B7BFF':'#DCE8FF'})); draw(0); }
  function draw(t){ x.clearRect(0,0,W,H); for(const p of st){ const px=(p.x+t*6*p.z)%W; x.globalAlpha=.25+.6*p.z; x.fillStyle=p.c; x.fillRect(px,p.y,p.z*1.6,p.z*1.6); } x.globalAlpha=1; }
  function loop(now){ draw(now/1000); if(!document.hidden) raf=requestAnimationFrame(loop); }
  addEventListener('resize',size); size(); if(!still){ raf=requestAnimationFrame(loop); document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); } }); }
})();
matchMedia('(max-width:720px)').addEventListener('change',()=>{ if(S.data) renderOrbit(); });
load(); setInterval(load,60000);
</script>
